services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        ports:
            - "8000:80"
        environment:
            APP_KEY: ${APP_KEY}
            APP_ENV: production
            APP_DEBUG: "false"
            DB_CONNECTION: mysql
            DB_HOST: db
            DB_PORT: 3306
            DB_DATABASE: laravel
            DB_USERNAME: laravel
            DB_PASSWORD: secret
            CACHE_DRIVER: redis
            SESSION_DRIVER: redis
            QUEUE_CONNECTION: redis
            REDIS_HOST: redis
        depends_on:
            - db
            - redis
        networks:
            - app-network
        restart: unless-stopped

    db:
        image: mysql:8.0
        environment:
            MYSQL_DATABASE: laravel
            MYSQL_USER: laravel
            MYSQL_PASSWORD: secret
            MYSQL_ROOT_PASSWORD: root
        volumes:
            - db-data:/var/lib/mysql
        networks:
            - app-network
        restart: unless-stopped

    redis:
        image: redis:7-alpine
        volumes:
            - redis-data:/data
        networks:
            - app-network
        restart: unless-stopped

volumes:
    db-data:
    redis-data:

networks:
    app-network:
        driver: bridge
